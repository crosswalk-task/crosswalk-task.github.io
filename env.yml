name: sphinx-docs

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - git
  - sphinx>=7,<8
  - myst-parser>=3,<4
  - sphinx-autobuild
  - sphinxcontrib-bibtex
  - ipykernel
  - pip:
      - jupyter-sphinx
      - sphinx-github-changelog
      - sphinxcontrib-video
      - git+https://github.com/Farama-Foundation/Celshast.git
      - highway-env
