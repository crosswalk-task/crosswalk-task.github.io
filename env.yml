name: sphinx-docs

channels:
  - conda-forge

dependencies:
  - python=3.11
  - nodejs=22
  - git
  - sphinx>=7,<8
  - sphinx-autobuild
  - sphinxcontrib-bibtex
  - myst-parser>=3,<4
  - ipykernel
  - pip
  - pip:
      - jupyter-sphinx
      - sphinx-github-changelog
      - sphinxcontrib-video
      - "git+https://github.com/bugoverdose/Celshast.git@6b422a26a7663be4f2ef52d142c80efa2f1c3b49"
