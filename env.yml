name: sphinx-docs

channels:
  - conda-forge

dependencies:
  - python=3.11
  - nodejs=18.17.1
  - git
  - sphinx>=7,<8
  - sphinx-autobuild
  - sphinxcontrib-bibtex
  - myst-parser>=3,<4
  - ipykernel
  - pip
  - pip:
      - jupyter-sphinx
      - sphinx-github-changelog
      - sphinxcontrib-video
      - "git+https://github.com/Farama-Foundation/Celshast.git@a95eef7ff7d0ce97a8c62a53bf8c381a121d1927"
